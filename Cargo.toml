[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [".", "crates/afterburner-core"]
resolver = "2"

[package.metadata.git-cliff.changelog]
header = """# Changelog

## TODO

- `process-compose-flake` local substrate fit gate [Runtime Infra, Serving/Deployment Infra]
  - Goal: Evaluate whether `process-compose-flake` should be the MacBook-local process substrate for running the Afterburner runtime stack and scheduler prototype so local multi-process orchestration stays reproducible without conflating local orchestration with `systemd`, Kubernetes, or scheduler policy.
  - Kind: `gate`
  - Boundary: `adapter-deployment`
  - Contracts: `ops`
  - Scope: `docs/adr/`, `README.md`, `tests/`, `flake.nix`

- FineWeb-Edu slice source adoption gate [Pre-training, Data Infra]
  - Goal: Define the approved FineWeb-Edu slice source key, `source_revision`, license/usage envelope, shard/checksum expectations, and local size budget so MacBook-scale text corpus selection is explicit and reproducible instead of a one-off download choice.
  - Kind: `gate`
  - Boundary: `core-contract`
  - Contracts: `artifact`
  - Scope: `docs/adr/`, `README.md`, `tests/`, `fixtures/`

- Burn `.bpk` artifact migration contract [Frameworks, Runtime Infra]
  - Goal: Migrate the repo's inference artifact contract from `.mpk` to `.bpk` only after a pinned Burn refresh confirms the target APIs and the repo is ready to cut over docs, fixtures, CLI paths, and event payloads together.
  - Kind: `mixed`
  - Boundary: `core-contract`
  - Contracts: `artifact`, `cli`, `event`
  - Scope: `Cargo.toml`, `src/`, `fixtures/`, `tests/`, `README.md`, `ARCHITECTURE.md`, `docs/adr/`

- Model optimization and packaging fit gate [Runtime Infra, Serving/Deployment Infra, Experimentation/Eval Infra]
  - Goal: Define the post-training optimization surface for quantization, compression, export, and packaging so efficiency work for constrained hardware stays a separate artifact pipeline from distributed runtime scale-out work.
  - Kind: `gate`
  - Boundary: `core-contract`
  - Contracts: `artifact`, `ops`
  - Scope: `docs/adr/`, `README.md`, `tests/`

- Burn distributed runtime layout feasibility gate [Distributed Training, Runtime Infra]
  - Goal: Define feasibility validation for candidate Burn-side DP/TP/PP/GAS/MBS/ZeRO layouts on 8-GPU nodes so invalid divisibility, topology, and memory combinations are rejected before any benchmark or training launch.
  - Kind: `gate`
  - Boundary: `core-contract`
  - Contracts: `ops`
  - Scope: `docs/adr/`, `README.md`, `tests/`

- GPU colocation fit gate [Runtime Infra, Serving/Deployment Infra]
  - Goal: Define whether selected low-saturation jobs may share one GPU under explicit compatibility and interference limits so utilization improvements stay separate from the scheduler's preemption model.
  - Kind: `gate`
  - Boundary: `adapter-deployment`
  - Contracts: `ops`
  - Scope: `docs/adr/`, `README.md`, `tests/`

## [Trunk]
"""
body = """
{% if commits | length > 0 -%}
{% for group, commits in commits | group_by(attribute="group") -%}

### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}])
{% endfor %}
{% endfor -%}
{% else -%}
- No notable changes.
{% endif -%}

{% if commits | length > 0 -%}

[Trunk]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/HEAD
{% for commit in commits -%}
[{{ commit.id | truncate(length=7, end="") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}
{% endfor -%}
{% endif -%}
"""
footer = """

<!-- generated by git-cliff -->"""
trim = false

[package.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = false
remote = "upstream"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chore" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = ".*", group = "Other" },
]
tag_pattern = "v*"

[package.metadata.git-cliff.remote]
offline = true

[package.metadata.git-cliff.remote.github]
owner = "zxfsee"
repo = "afterburner"

[package.metadata.afterburner.compiler_feature_matrix]
schema_version = "1"

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "cpu"
enabled_features = ["ndarray"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "wgpu"
enabled_features = ["wgpu"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "metal"
enabled_features = ["wgpu", "metal"]

[[bin]]
name = "afterburner-http"
path = "src/bin/afterburner_http.rs"

[[bin]]
name = "afterburner-dashboard"
path = "src/bin/afterburner_dashboard.rs"

[dependencies]
afterburner-core = { path = "crates/afterburner-core" }
base64 = "0.22"
burn = { version = "0.20.1", features = [
  "fusion",
  "metal",
  "std",
  "train",
  "tui",
  "vision",
  "wgpu",
  "ndarray",
] }
ctrlc = "3.4"
png = "0.17"
ratatui = "0.29.0"
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[dependencies.burn-autodiff]
version = "0.20.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
