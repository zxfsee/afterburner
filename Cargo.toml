[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [".", "crates/afterburner-core"]
resolver = "2"

[package.metadata.git-cliff.changelog]
header = """# Changelog

## TODO

- Rollout pointer mutation typed helper extraction [Runtime Infra, Serving/Deployment Infra]
  - Goal: Push rollout pointer and state mutation flows behind typed commands so recipes stop directly encoding canonical state-file mutation and family-specific rollout behavior.
  - Kind: `mixed`
  - Boundary: `repo-workflow`
  - Contracts: `cli`, `artifact`, `event`
  - Scope: `justfile`, `src/`, `tests/`, `docs/workflows.md`, `docs/reference.md`

- Distributed shard-lineage grouped entrypoint extraction [Distributed Training, Runtime Infra]
  - Goal: Collapse the distributed shard-lineage noun-variant recipe expansion into grouped `just` entrypoints backed by typed helpers so the lineage family stops carrying its own hand-expanded command registry in `justfile`.
  - Kind: `mixed`
  - Boundary: `repo-workflow`
  - Contracts: `cli`
  - Scope: `justfile`, `src/`, `tests/`, `docs/workflows.md`, `docs/reference.md`

- Routing and orchestration semantic regression gate [Runtime Infra, Serving/Deployment Infra]
  - Goal: Add one focused mechanical guard so `src/main.rs`, `justfile`, and related routing/orchestration surfaces do not regress into owning domain payload-building, protocol parsing, artifact-family semantics, or recipe-body `just` CLI re-entry after the extraction work lands.
  - Kind: `gate`
  - Boundary: `none`
  - Contracts: `cli`
  - Scope: `src/main.rs`, `src/cli_dispatch/`, `justfile`, `tests/`

- Grouped distributed-lineage docs surface consolidation [Runtime Infra]
  - Goal: Collapse the distributed shard-lineage sections in docs/reference.md and docs/workflows.md from per-artifact registries into grouped family maps while leaving exhaustive mechanical coverage in the existing family-level tests.
  - Kind: `mixed`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `docs/reference.md`, `docs/workflows.md`, `tests/`

- GitHub repo settings polish [Runtime Infra, Serving/Deployment Infra]
  - Goal: Apply the GitHub repository description/topics/website settings directly or from one small maintenance note without growing README, reference-index, or docs-only string-presence test surface.
  - Kind: `mixed`
  - Boundary: `repo-workflow`
  - Contracts: `none`
  - Scope: `unknown`

- Burn `.bpk` artifact migration contract [Frameworks, Runtime Infra]
  - Goal: Migrate the repo's inference artifact contract from `.mpk` to `.bpk` only after a pinned Burn refresh confirms the target APIs and the repo is ready to cut over docs, fixtures, CLI paths, and event payloads together.
  - Kind: `mixed`
  - Boundary: `core-contract`
  - Contracts: `artifact`, `cli`, `event`
  - Scope: `Cargo.toml`, `src/`, `fixtures/`, `tests/`, `README.md`, `ARCHITECTURE.md`, `docs/adr/`
  - Blocked-by: Newer stable Burn release after `0.20.1`; see ADR-033.

## [Trunk]
"""
body = """
{% if commits | length > 0 -%}
{% for group, commits in commits | group_by(attribute="group") -%}

### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}])
{% endfor %}
{% endfor -%}
{% else -%}
- No notable changes.
{% endif -%}

{% if commits | length > 0 -%}

[Trunk]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/HEAD
{% for commit in commits -%}
[{{ commit.id | truncate(length=7, end="") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}
{% endfor -%}
{% endif -%}
"""
footer = """

<!-- generated by git-cliff -->"""
trim = false

[package.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = false
remote = "upstream"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chore" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = ".*", group = "Other" },
]
tag_pattern = "v*"

[package.metadata.git-cliff.remote]
offline = true

[package.metadata.git-cliff.remote.github]
owner = "zxfsee"
repo = "afterburner"

[package.metadata.afterburner.compiler_feature_matrix]
schema_version = "1"

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "cpu"
enabled_features = ["ndarray"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "wgpu"
enabled_features = ["wgpu"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "metal"
enabled_features = ["wgpu", "metal"]

[[bin]]
name = "afterburner-http"
path = "src/bin/afterburner_http.rs"

[[bin]]
name = "afterburner-dashboard"
path = "src/bin/afterburner_dashboard.rs"

[dependencies]
afterburner-core = { path = "crates/afterburner-core" }
base64 = "0.22"
burn = { version = "0.20.1", features = [
  "fusion",
  "metal",
  "std",
  "train",
  "tui",
  "vision",
  "wgpu",
  "ndarray",
] }
ctrlc = "3.4"
png = "0.17"
ratatui = "0.29.0"
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[dependencies.burn-autodiff]
version = "0.20.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
