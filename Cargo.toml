[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [".", "crates/afterburner-core"]
resolver = "2"

[package.metadata.git-cliff.changelog]
header = """# Changelog

## TODO

- Grouped profiling docs wording tightening [Runtime Infra]
  - Goal: Keep the grouped profiling workflow docs concise and operator-centered by trimming any remaining wording that reads like artifact enumeration instead of family-level guidance.
  - Kind: `mixed`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `docs/reference.md`, `docs/workflows.md`, `tests/profiling_workflow_surface.rs`

- Grouped rollout docs wording tightening [Serving/Deployment Infra]
  - Goal: Keep the rollout workflow docs concise and operator-centered by trimming any remaining wording that reads like artifact enumeration instead of family-level guidance.
  - Kind: `mixed`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `docs/reference.md`, `docs/workflows.md`, `tests/promotion_orchestration.rs`

- Backlog runnable-promotion semantics hardening [Runtime Infra]
  - Goal: Make queue repair and promotion semantics prefer the highest-priority runnable item cleanly when the active queue cannot satisfy runnability on its own, so blocked items do not just move around inside the active horizon without a clear next repair path.
  - Kind: `mixed`
  - Boundary: `repo-workflow`
  - Contracts: `ops`
  - Scope: `src/bin/workflow_queue_snapshot.rs`, `tests/queue_snapshot.rs`, `docs/backlog.md`, `Cargo.toml`

- Queue preflight branching extraction [Runtime Infra]
  - Goal: Move the remaining queue repair and stale-snapshot branching out of `justfile` recipe control flow and into typed queue helpers so queue preflight stays canonical without embedding workflow policy in shell logic.
  - Kind: `mixed`
  - Boundary: `repo-workflow`
  - Contracts: `ops`
  - Scope: `justfile`, `src/bin/workflow_queue_snapshot.rs`, `src/bin/workflow_objective_lock.rs`, `tests/justfile_thinness_gate.rs`, `tests/queue_snapshot.rs`, `tests/developer_workflows.rs`

- Grouped source and lineage docs wording tightening [Data Infra, Distributed Training]
  - Goal: Keep the grouped source and lineage workflow docs concise and operator-centered by trimming remaining wording that still reads like subcommand enumeration instead of family-level guidance.
  - Kind: `mixed`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `docs/reference.md`, `docs/workflows.md`, `tests/pretraining_source_workflow_surface.rs`, `tests/distributed_shard_lineage_workflow_surface.rs`

- Grouped deployment matrix docs wording tightening [Serving/Deployment Infra]
  - Goal: Keep the main deployment workflow docs concise and operator-centered by trimming remaining wording that still reads like subcommand inventory instead of grouped operator guidance.
  - Kind: `mixed`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `docs/workflows.md`, `tests/deployment_matrix_workflow_surface.rs`

## [Trunk]
"""
body = """
{% if commits | length > 0 -%}
{% for group, commits in commits | group_by(attribute="group") -%}

### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}])
{% endfor %}
{% endfor -%}
{% else -%}
- No notable changes.
{% endif -%}

{% if commits | length > 0 -%}

[Trunk]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/HEAD
{% for commit in commits -%}
[{{ commit.id | truncate(length=7, end="") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}
{% endfor -%}
{% endif -%}
"""
footer = """

<!-- generated by git-cliff -->"""
trim = false

[package.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = false
remote = "upstream"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chore" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = ".*", group = "Other" },
]
tag_pattern = "v*"

[package.metadata.git-cliff.remote]
offline = true

[package.metadata.git-cliff.remote.github]
owner = "zxfsee"
repo = "afterburner"

[package.metadata.afterburner.compiler_feature_matrix]
schema_version = "1"

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "cpu"
enabled_features = ["ndarray"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "wgpu"
enabled_features = ["wgpu"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "metal"
enabled_features = ["wgpu", "metal"]

[[bin]]
name = "afterburner-http"
path = "src/bin/afterburner_http.rs"

[[bin]]
name = "afterburner-dashboard"
path = "src/bin/afterburner_dashboard.rs"

[dependencies]
afterburner-core = { path = "crates/afterburner-core" }
base64 = "0.22"
burn = { version = "0.20.1", features = [
  "fusion",
  "metal",
  "std",
  "train",
  "tui",
  "vision",
  "wgpu",
  "ndarray",
] }
ctrlc = "3.4"
png = "0.17"
ratatui = "0.29.0"
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[dependencies.burn-autodiff]
version = "0.20.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
