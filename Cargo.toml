[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [".", "crates/afterburner-core"]
resolver = "2"

[package.metadata.git-cliff.changelog]
header = """# Changelog

## TODO

- Scheduler heartbeat pointer rollback helper extraction [Distributed Training, Runtime Infra, Serving/Deployment Infra]
  - Goal: Consolidate the pointer rollback payload/history/reconciliation/supersession helper logic before the remaining rollback variants multiply field/path drift across nearly identical debug deploy writers.
  - Kind: `mixed`
  - Boundary: `runtime-scheduler`
  - Contracts: `artifact`, `event`, `ops`
  - Scope: `src/`, `tests/`, `docs/reference.md`, `docs/workflows.md`, `docs/adr/`

- Scheduler heartbeat pointer rollback helper rollout [Distributed Training, Runtime Infra, Serving/Deployment Infra]
  - Goal: Apply the extracted rollback helper layer across the remaining pointer rollback variants so the shared writer fields and emitted-event guarantees stay aligned after helper extraction lands.
  - Kind: `mixed`
  - Boundary: `runtime-scheduler`
  - Contracts: `artifact`, `event`, `ops`
  - Scope: `src/`, `tests/`, `docs/reference.md`, `docs/workflows.md`, `docs/adr/`
  - Blocked-by: Scheduler heartbeat pointer rollback helper extraction

- Scheduler heartbeat pointer rollback helper adoption gate [Distributed Training, Runtime Infra, Serving/Deployment Infra]
  - Goal: Add one focused regression gate that fails if the extracted rollback helper leaves any rollback variant with drifted field sets, event names, or artifact paths after rollout lands.
  - Kind: `gate`
  - Boundary: `runtime-scheduler`
  - Contracts: `artifact`, `event`, `ops`
  - Scope: `tests/`, `docs/reference.md`, `docs/workflows.md`, `docs/adr/`
  - Blocked-by: Scheduler heartbeat pointer rollback helper rollout

- Burn `.bpk` artifact migration contract [Frameworks, Runtime Infra]
  - Goal: Migrate the repo's inference artifact contract from `.mpk` to `.bpk` only after a pinned Burn refresh confirms the target APIs and the repo is ready to cut over docs, fixtures, CLI paths, and event payloads together.
  - Kind: `mixed`
  - Boundary: `core-contract`
  - Contracts: `artifact`, `cli`, `event`
  - Scope: `Cargo.toml`, `src/`, `fixtures/`, `tests/`, `README.md`, `ARCHITECTURE.md`, `docs/adr/`
  - Blocked-by: Newer stable Burn release after `0.20.1`; see ADR-033.

- README front-page tightening and quick-start consistency [Runtime Infra, Serving/Deployment Infra]
  - Goal: Tighten the GitHub landing page so it reads as a clear project-facing entrypoint, fix the `just eval` vs `just eval-gate` ambiguity, and keep detailed workflow/reference material pushed into the linked docs surfaces.
  - Kind: `mixed`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `README.md`

- GitHub repo metadata candidates doc [Runtime Infra, Serving/Deployment Infra]
  - Goal: Record a short description/topic set for the repo in the docs surface so the later GitHub metadata polish has one explicit source of truth instead of relying on transient chat context.
  - Kind: `mixed`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `README.md`, `docs/reference.md`

## [Trunk]
"""
body = """
{% if commits | length > 0 -%}
{% for group, commits in commits | group_by(attribute="group") -%}

### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}])
{% endfor %}
{% endfor -%}
{% else -%}
- No notable changes.
{% endif -%}

{% if commits | length > 0 -%}

[Trunk]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/HEAD
{% for commit in commits -%}
[{{ commit.id | truncate(length=7, end="") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}
{% endfor -%}
{% endif -%}
"""
footer = """

<!-- generated by git-cliff -->"""
trim = false

[package.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = false
remote = "upstream"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chore" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = ".*", group = "Other" },
]
tag_pattern = "v*"

[package.metadata.git-cliff.remote]
offline = true

[package.metadata.git-cliff.remote.github]
owner = "zxfsee"
repo = "afterburner"

[package.metadata.afterburner.compiler_feature_matrix]
schema_version = "1"

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "cpu"
enabled_features = ["ndarray"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "wgpu"
enabled_features = ["wgpu"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "metal"
enabled_features = ["wgpu", "metal"]

[[bin]]
name = "afterburner-http"
path = "src/bin/afterburner_http.rs"

[[bin]]
name = "afterburner-dashboard"
path = "src/bin/afterburner_dashboard.rs"

[dependencies]
afterburner-core = { path = "crates/afterburner-core" }
base64 = "0.22"
burn = { version = "0.20.1", features = [
  "fusion",
  "metal",
  "std",
  "train",
  "tui",
  "vision",
  "wgpu",
  "ndarray",
] }
ctrlc = "3.4"
png = "0.17"
ratatui = "0.29.0"
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[dependencies.burn-autodiff]
version = "0.20.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
