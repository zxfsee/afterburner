[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [".", "crates/afterburner-core"]
resolver = "2"

[package.metadata.git-cliff.changelog]
header = """# Changelog

## TODO

- Burn dependency refresh gate [Frameworks, Runtime Infra]
  - Goal: Keep the pinned Burn stack reasonably current and record any recorder/storage contract drift before it leaks into Afterburner artifact decisions by surprise.
  - Kind: `gate`
  - Boundary: `core-contract`
  - Contracts: `none`
  - Scope: `Cargo.toml`, `Cargo.lock`, `tests/`, `README.md`, `docs/adr/`

- Distributed load profile contract [Serving/Deployment Infra, Experimentation/Eval Infra]
  - Goal: Materialize a reproducible distributed load profile and results artifact so deployment decisions can be checked against concurrency, latency, error budgets, and multi-worker traffic distribution under sustained load instead of only single-request fixtures.
  - Kind: `mixed`
  - Boundary: `adapter-deployment`
  - Contracts: `artifact`, `ops`
  - Scope: `src/bin/afterburner_http.rs`, `tests/`, `fixtures/`, `README.md`, `justfile`

- CLI subcommand hierarchy migration contract [Runtime Infra, Serving/Deployment Infra]
  - Goal: Collapse the flat `afterburner` command namespace into grouped subcommands where it improves typical operator use, and cut over docs, tests, and workflow recipes in one explicit CLI contract change instead of accreting more top-level verbs.
  - Kind: `mixed`
  - Boundary: `adapter-cli`
  - Contracts: `cli`
  - Scope: `src/`, `tests/`, `README.md`, `justfile`, `docs/adr/`

- Afterburner stack deployment contract [Serving/Deployment Infra, Runtime Infra]
  - Goal: Define the deployable unit and activation contract for the full Afterburner runtime stack so deployment covers the service surface, artifact roots, rollout entrypoints, and observability hooks instead of treating the model file as the whole deployable system.
  - Kind: `mixed`
  - Boundary: `adapter-deployment`
  - Contracts: `artifact`, `ops`
  - Scope: `docs/adr/`, `README.md`, `tests/`, `src/`, `justfile`

- Burn distributed learning-strategy fit gate [Distributed Training, Frameworks]
  - Goal: Evaluate whether Afterburner should mirror Burn's distributed learning-strategy model instead of continuing to treat `worker_parallelism` as only a local throughput knob.
  - Kind: `gate`
  - Boundary: `core-contract`
  - Contracts: `none`
  - Scope: `docs/adr/`, `README.md`, `tests/`
  - Blocked-by: Burn dependency refresh gate.

- Distributed world and rank topology gate [Distributed Training, Runtime Infra]
  - Goal: Define explicit world-size, rank, and device-group metadata for future distributed training so execution topology is not inferred from local worker IDs or shard filenames alone.
  - Kind: `gate`
  - Boundary: `core-contract`
  - Contracts: `artifact`, `ops`
  - Scope: `docs/adr/`, `README.md`, `tests/`
  - Blocked-by: Burn dependency refresh gate.

## [Trunk]
"""
body = """
{% if commits | length > 0 -%}
{% for group, commits in commits | group_by(attribute="group") -%}

### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}])
{% endfor %}
{% endfor -%}
{% else -%}
- No notable changes.
{% endif -%}

{% if commits | length > 0 -%}

[Trunk]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/HEAD
{% for commit in commits -%}
[{{ commit.id | truncate(length=7, end="") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}
{% endfor -%}
{% endif -%}
"""
footer = """

<!-- generated by git-cliff -->"""
trim = false

[package.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = false
remote = "upstream"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chore" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = ".*", group = "Other" },
]
tag_pattern = "v*"

[package.metadata.git-cliff.remote]
offline = true

[package.metadata.git-cliff.remote.github]
owner = "zxfsee"
repo = "afterburner"

[package.metadata.afterburner.compiler_feature_matrix]
schema_version = "1"

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "cpu"
enabled_features = ["ndarray"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "wgpu"
enabled_features = ["wgpu"]

[[bin]]
name = "afterburner-http"
path = "src/bin/afterburner_http.rs"

[[bin]]
name = "afterburner-dashboard"
path = "src/bin/afterburner_dashboard.rs"

[dependencies]
afterburner-core = { path = "crates/afterburner-core" }
base64 = "0.22"
burn = { version = "0.20.1", features = [
  "fusion",
  "std",
  "train",
  "tui",
  "vision",
  "wgpu",
  "ndarray",
] }
ctrlc = "3.4"
png = "0.17"
ratatui = "0.29.0"
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[dependencies.burn-autodiff]
version = "0.20.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
