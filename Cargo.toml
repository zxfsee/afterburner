[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[package.metadata.git-cliff.changelog]
header = """# Changelog

## TODO

- Infer stdout success fixture gate [Inference, Runtime Infra]
  - Goal: Pin `afterburner infer` stdout payload shape (`logits`/`probabilities`) with fixture-backed assertions; fail on output contract drift.
  - Kind: `gate`
  - Boundary: `adapter-cli`
  - Contracts: `CLI`, `artifact`
  - Scope: `tests/infer_logits_numerics.rs`, `fixtures/infer_stdout_success.json`

- Eval summary includes artifact version parity [Experimentation/Eval Infra, Inference]
  - Goal: Include resolved `artifact_version` in eval summary/event output and assert parity with infer contract resolution.
  - Kind: `mixed`
  - Boundary: `adapter-cli`
  - Contracts: `CLI`, `artifact`
  - Scope: `src/cmd_eval.rs`, `tests/eval_cli.rs`, `tests/infer_path.rs`

- HTTP infer success fixture gate [Serving/Deployment Infra, Inference]
  - Goal: Pin HTTP `/infer` success envelope fields/shape with fixture-backed assertions to prevent adapter drift.
  - Kind: `gate`
  - Boundary: `adapter-http`
  - Contracts: `HTTP`
  - Scope: `tests/http_graceful_shutdown.rs`, `fixtures/http_infer_success_envelope.json`

- Eval pipeline monitoring contract definition [Experimentation/Eval Infra, Runtime Infra]
  - Goal: Define and gate a stable eval monitoring contract using RED (rate/errors/duration) plus eval quality/context fields (`accuracy`, `samples`, `artifact_version`, `batches_evaluated`, `batch_size`, `seed`) before broadening instrumentation.
  - Kind: `mixed`
  - Boundary: `adapter-cli`
  - Contracts: `event`, `artifact`
  - Scope: `src/cmd_eval.rs`, `tests/eval_cli.rs`, `fixtures/eval_pipeline_monitoring_event.json`, `artifacts/eval/mnist_eval_summary.json`
  
- Eval pipeline monitoring event fixture gate [Experimentation/Eval Infra, Runtime Infra]
  - Goal: Pin eval monitoring event payload shape/required RED+quality fields with a fixture-backed gate.
  - Kind: `gate`
  - Boundary: `adapter-cli`
  - Contracts: `event`
  - Scope: `tests/eval_cli.rs`, `fixtures/eval_pipeline_monitoring_event.json`
  - Blocked-by: Eval pipeline monitoring contract definition

- Eval pipeline monitoring artifact schema gate [Experimentation/Eval Infra, Data Infra]
  - Goal: Pin eval summary artifact schema/required monitoring fields so downstream tooling sees stable contract shape.
  - Kind: `gate`
  - Boundary: `adapter-cli`
  - Contracts: `artifact`
  - Scope: `tests/eval_cli.rs`, `fixtures/eval_pipeline_monitoring_artifact.schema.json`, `artifacts/eval/mnist_eval_summary.json`
  - Blocked-by: Eval pipeline monitoring contract definition

- Deploy-rs baseline deployment contract [Serving/Deployment Infra]
  - Goal: Introduce a minimal `serokell/deploy-rs` flake contract and validation gate so deployment wiring is explicit, testable, and adapter-scoped.
  - Kind: `mixed`
  - Boundary: `adapter-deployment`
  - Contracts: `artifact`, `ops`
  - Scope: `flake.nix`, `justfile`, `docs/adr/`, `ARCHITECTURE.md`
  - Blocked-by: Decision needed on deployment target profile model (NixOS system profile vs non-root app profile) and artifact rollout ownership.

## [Trunk]
"""
body = """
{% if commits | length > 0 -%}
{% for group, commits in commits | group_by(attribute="group") -%}

### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}])
{% endfor %}
{% endfor -%}
{% else -%}
- No notable changes.
{% endif -%}

{% if commits | length > 0 -%}

[Trunk]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/HEAD
{% for commit in commits -%}
[{{ commit.id | truncate(length=7, end="") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}
{% endfor -%}
{% endif -%}
"""
footer = """

<!-- generated by git-cliff -->"""
trim = false

[package.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = false
remote = "upstream"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chore" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = ".*", group = "Other" },
]
tag_pattern = "v*"

[package.metadata.git-cliff.remote.github]
owner = "zxfsee"
repo = "afterburner"
offline = true

[package.metadata.afterburner.compiler_feature_matrix]
schema_version = "1"

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "cpu"
enabled_features = ["ndarray"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "wgpu"
enabled_features = ["wgpu"]

[[bin]]
name = "afterburner-http"
path = "src/bin/afterburner_http.rs"

[dependencies]
base64 = "0.22"
burn = { version = "0.20.1", features = [
  "fusion",
  "std",
  "train",
  "tui",
  "vision",
  "wgpu",
  "ndarray",
] }
ctrlc = "3.4"
png = "0.17"
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[dependencies.burn-autodiff]
version = "0.20.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
