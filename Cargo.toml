[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [".", "crates/afterburner-core"]
resolver = "2"

[package.metadata.git-cliff.changelog]
header = """# Changelog

## TODO

- Grouped deployment-verification receipt and handoff artifact split validation gate alignment [Serving/Deployment Infra]
  - Goal: Keep the shared README/reference split validator aligned with the remaining deployment-verification receipt and handoff artifact cluster so the grouped verification reference surface cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

- Grouped deployment-stack transport/locator artifact split validation gate alignment [Serving/Deployment Infra]
  - Goal: Keep the shared README/reference split validator aligned with the deployment-stack transport and locator artifact cluster so the grouped deployment-stack locator surface cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

- Grouped deployment-stack check artifact split validation gate alignment [Serving/Deployment Infra]
  - Goal: Keep the shared README/reference split validator aligned with `deployment_stack_check.json` so the grouped deployment-stack check surface cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

- Grouped training/inference artifact and event split validation gate alignment [Inference, Runtime Infra]
  - Goal: Keep the shared README/reference split validator aligned with the top training and inference contract artifacts and events so the front-section reference surface cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

- Grouped training/inference contract split validation gate alignment [Inference, Runtime Infra]
  - Goal: Keep the shared README/reference split validator aligned with the top training and inference contract surfaces so the reference index front section cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

- Grouped inference-side contract detail split validation gate alignment [Inference, Runtime Infra]
  - Goal: Keep the shared README/reference split validator aligned with the remaining inference-side contract details such as versioned artifact layout, manifest paths, calibration metadata, and observability path naming so the front-section reference surface cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

## [Trunk]
"""
body = """
{% if commits | length > 0 -%}
{% for group, commits in commits | group_by(attribute="group") -%}

### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}])
{% endfor %}
{% endfor -%}
{% else -%}
- No notable changes.
{% endif -%}

{% if commits | length > 0 -%}

[Trunk]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/HEAD
{% for commit in commits -%}
[{{ commit.id | truncate(length=7, end="") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}
{% endfor -%}
{% endif -%}
"""
footer = """

<!-- generated by git-cliff -->"""
trim = false

[package.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = false
remote = "upstream"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chore" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = ".*", group = "Other" },
]
tag_pattern = "v*"

[package.metadata.git-cliff.remote]
offline = true

[package.metadata.git-cliff.remote.github]
owner = "zxfsee"
repo = "afterburner"

[package.metadata.afterburner.compiler_feature_matrix]
schema_version = "1"

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "cpu"
enabled_features = ["ndarray"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "wgpu"
enabled_features = ["wgpu"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "metal"
enabled_features = ["wgpu", "metal"]

[[bin]]
name = "afterburner-http"
path = "src/bin/afterburner_http.rs"

[[bin]]
name = "afterburner-dashboard"
path = "src/bin/afterburner_dashboard.rs"

[dependencies]
afterburner-core = { path = "crates/afterburner-core" }
base64 = "0.22"
burn = { version = "0.20.1", features = [
  "fusion",
  "metal",
  "std",
  "train",
  "tui",
  "vision",
  "wgpu",
  "ndarray",
] }
ctrlc = "3.4"
png = "0.17"
ratatui = "0.29.0"
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[dependencies.burn-autodiff]
version = "0.20.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
