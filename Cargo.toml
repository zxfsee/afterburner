[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [".", "crates/afterburner-core"]
resolver = "2"

[package.metadata.git-cliff.changelog]
header = """# Changelog

## TODO

- Deployment stack launch locator pointer adapter [Serving/Deployment Infra, Runtime Infra]
  - Goal: Export one stable current-pointer artifact over the deployment stack launch transport locator so downstream deployment consumers can resolve the current stack-launch locator without depending on local locator path conventions.
  - Kind: `mixed`
  - Boundary: `adapter-deployment`
  - Contracts: `artifact`, `event`, `ops`
  - Scope: `src/`, `fixtures/`, `tests/`, `README.md`, `justfile`, `docs/adr/`

- Architecture reference ownership gate [Runtime Infra, Serving/Deployment Infra]
  - Goal: Keep `ARCHITECTURE.md` focused on system shape and invariants while `docs/reference.md` owns the faster-moving capability and fit catalog, so future doc cleanup does not drift back into duplicated architecture prose.
  - Kind: `gate`
  - Boundary: `none`
  - Contracts: `none`
  - Scope: `ARCHITECTURE.md`, `docs/reference.md`, `tests/`

- Docs ownership separation gate [Runtime Infra, Serving/Deployment Infra]
  - Goal: Keep `README.md`, `docs/workflows.md`, `docs/reference.md`, and `ARCHITECTURE.md` in distinct roles so frontpage, workflow, capability, and architecture content do not drift back into duplicated ownership.
  - Kind: `gate`
  - Boundary: `none`
  - Contracts: `none`
  - Scope: `README.md`, `docs/workflows.md`, `docs/reference.md`, `ARCHITECTURE.md`, `tests/`

- Cooperative checkpoint preemption fit gate [Runtime Infra, Serving/Deployment Infra]
  - Goal: Define the scheduler-side contract for cooperative checkpoint/resume preemption so urgent jobs can interrupt lower-priority work only at safe runtime checkpoint boundaries instead of assuming transparent GPU task suspension.
  - Kind: `gate`
  - Boundary: `adapter-deployment`
  - Contracts: `ops`, `event`
  - Scope: `docs/adr/`, `README.md`, `tests/`

- Distributed shard lineage transport locator adapter [Distributed Training, Data Infra]
  - Goal: Export one stable transport-facing locator over the distributed shard lineage evidence handoff so downstream distributed tooling can resolve the current lineage handoff without depending on local handoff path conventions.
  - Kind: `mixed`
  - Boundary: `core-contract`
  - Contracts: `artifact`, `event`
  - Scope: `src/`, `fixtures/`, `tests/`, `README.md`, `docs/adr/`

- kube-rs GPU lease reconciliation adapter [Runtime Infra, Serving/Deployment Infra]
  - Goal: Materialize a kube-rs-oriented lease reconciliation surface that reuses the existing scheduler lease and lifecycle model so the cluster path can evolve through one adapter contract instead of ad hoc controller assumptions.
  - Kind: `mixed`
  - Boundary: `adapter-deployment`
  - Contracts: `artifact`, `ops`, `event`
  - Scope: `src/`, `fixtures/`, `tests/`, `README.md`, `docs/adr/`

## [Trunk]
"""
body = """
{% if commits | length > 0 -%}
{% for group, commits in commits | group_by(attribute="group") -%}

### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}])
{% endfor %}
{% endfor -%}
{% else -%}
- No notable changes.
{% endif -%}

{% if commits | length > 0 -%}

[Trunk]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/HEAD
{% for commit in commits -%}
[{{ commit.id | truncate(length=7, end="") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}
{% endfor -%}
{% endif -%}
"""
footer = """

<!-- generated by git-cliff -->"""
trim = false

[package.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = false
remote = "upstream"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chore" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = ".*", group = "Other" },
]
tag_pattern = "v*"

[package.metadata.git-cliff.remote]
offline = true

[package.metadata.git-cliff.remote.github]
owner = "zxfsee"
repo = "afterburner"

[package.metadata.afterburner.compiler_feature_matrix]
schema_version = "1"

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "cpu"
enabled_features = ["ndarray"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "wgpu"
enabled_features = ["wgpu"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "metal"
enabled_features = ["wgpu", "metal"]

[[bin]]
name = "afterburner-http"
path = "src/bin/afterburner_http.rs"

[[bin]]
name = "afterburner-dashboard"
path = "src/bin/afterburner_dashboard.rs"

[dependencies]
afterburner-core = { path = "crates/afterburner-core" }
base64 = "0.22"
burn = { version = "0.20.1", features = [
  "fusion",
  "metal",
  "std",
  "train",
  "tui",
  "vision",
  "wgpu",
  "ndarray",
] }
ctrlc = "3.4"
png = "0.17"
ratatui = "0.29.0"
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[dependencies.burn-autodiff]
version = "0.20.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
