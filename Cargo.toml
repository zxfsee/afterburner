[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [".", "crates/afterburner-core"]
resolver = "2"

[package.metadata.git-cliff.changelog]
header = """# Changelog

## TODO

- Grouped drift section split validation gate alignment [Experimentation/Eval Infra]
  - Goal: Keep the shared README/reference split validator aligned with the drift section heading and family artifacts so the grouped drift reference surface cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

- Grouped deployment-utility reference split validation gate alignment [Serving/Deployment Infra]
  - Goal: Keep the shared README/reference split validator aligned with the deployment-utility artifact family so utility artifacts cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

- Grouped Burn inventory reference split validation gate alignment [Frameworks, Runtime Infra]
  - Goal: Keep the shared README/reference split validator aligned with the Burn migration inventory artifact so that explicit cutover-tracking coverage cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

- Grouped deployment-utility runtime/publish split validation gate alignment [Serving/Deployment Infra]
  - Goal: Keep the shared README/reference split validator aligned with the remaining deployment-utility runtime, load, and publish artifacts so those grouped utility surfaces cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

- Grouped kube-lease reference split validation gate alignment [Serving/Deployment Infra]
  - Goal: Keep the shared README/reference split validator aligned with the kube-lease artifact cluster so the grouped deployment-stack lease surface cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

- Grouped drift extended artifact split validation gate alignment [Experimentation/Eval Infra]
  - Goal: Keep the shared README/reference split validator aligned with the remaining drift history, checkpoint, bundle, handoff, transport-locator, rollback, supersession, and refresh artifacts so the grouped drift reference surface cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

## [Trunk]
"""
body = """
{% if commits | length > 0 -%}
{% for group, commits in commits | group_by(attribute="group") -%}

### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}])
{% endfor %}
{% endfor -%}
{% else -%}
- No notable changes.
{% endif -%}

{% if commits | length > 0 -%}

[Trunk]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/HEAD
{% for commit in commits -%}
[{{ commit.id | truncate(length=7, end="") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}
{% endfor -%}
{% endif -%}
"""
footer = """

<!-- generated by git-cliff -->"""
trim = false

[package.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = false
remote = "upstream"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chore" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = ".*", group = "Other" },
]
tag_pattern = "v*"

[package.metadata.git-cliff.remote]
offline = true

[package.metadata.git-cliff.remote.github]
owner = "zxfsee"
repo = "afterburner"

[package.metadata.afterburner.compiler_feature_matrix]
schema_version = "1"

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "cpu"
enabled_features = ["ndarray"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "wgpu"
enabled_features = ["wgpu"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "metal"
enabled_features = ["wgpu", "metal"]

[[bin]]
name = "afterburner-http"
path = "src/bin/afterburner_http.rs"

[[bin]]
name = "afterburner-dashboard"
path = "src/bin/afterburner_dashboard.rs"

[dependencies]
afterburner-core = { path = "crates/afterburner-core" }
base64 = "0.22"
burn = { version = "0.20.1", features = [
  "fusion",
  "metal",
  "std",
  "train",
  "tui",
  "vision",
  "wgpu",
  "ndarray",
] }
ctrlc = "3.4"
png = "0.17"
ratatui = "0.29.0"
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[dependencies.burn-autodiff]
version = "0.20.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
