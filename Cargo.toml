[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [".", "crates/afterburner-core"]
resolver = "2"

[package.metadata.git-cliff.changelog]
header = """# Changelog

## TODO

- Grouped deployment-verification shared reference validation wording alignment [Serving/Deployment Infra]
  - Goal: Keep the shared reference validation surface aligned with the newer deployment-verification artifact-group and support-flow wording so the reference index cannot drift without the shared validator noticing.
  - Kind: `mixed`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/reference_doc_validation.rs`

- Grouped source/lineage validation wording gate alignment [Data Infra, Distributed Training]
  - Goal: Keep the source and lineage family surface tests aligned with the newer grouped operator-flow wording so validation no longer lags behind the updated reference headings.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/pretraining_source_workflow_surface.rs`, `tests/distributed_shard_lineage_workflow_surface.rs`

- Grouped source/lineage reference split validation gate alignment [Data Infra, Distributed Training]
  - Goal: Keep the shared README/reference split validator aligned with the newer source and lineage artifact-group wording so the reference index headings cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

- Grouped rollout reference split validation gate alignment [Serving/Deployment Infra]
  - Goal: Keep the shared README/reference split validator aligned with the newer rollout reference heading so the grouped rollout reference surface cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

- Grouped scheduler-heartbeat reference split validation gate alignment [Serving/Deployment Infra]
  - Goal: Keep the shared README/reference split validator aligned with the scheduler-heartbeat artifact-group heading so the grouped scheduler reference surface cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

- Grouped deployment-stack reference split validation gate alignment [Serving/Deployment Infra]
  - Goal: Keep the shared README/reference split validator aligned with the deployment-stack artifact-group heading so the grouped deployment-stack reference surface cannot drift unnoticed.
  - Kind: `gate`
  - Boundary: `repo-workflow`
  - Contracts: `docs`
  - Scope: `tests/readme_reference_split.rs`

## [Trunk]
"""
body = """
{% if commits | length > 0 -%}
{% for group, commits in commits | group_by(attribute="group") -%}

### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}])
{% endfor %}
{% endfor -%}
{% else -%}
- No notable changes.
{% endif -%}

{% if commits | length > 0 -%}

[Trunk]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/HEAD
{% for commit in commits -%}
[{{ commit.id | truncate(length=7, end="") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}
{% endfor -%}
{% endif -%}
"""
footer = """

<!-- generated by git-cliff -->"""
trim = false

[package.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = false
remote = "upstream"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chore" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = ".*", group = "Other" },
]
tag_pattern = "v*"

[package.metadata.git-cliff.remote]
offline = true

[package.metadata.git-cliff.remote.github]
owner = "zxfsee"
repo = "afterburner"

[package.metadata.afterburner.compiler_feature_matrix]
schema_version = "1"

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "cpu"
enabled_features = ["ndarray"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "wgpu"
enabled_features = ["wgpu"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "metal"
enabled_features = ["wgpu", "metal"]

[[bin]]
name = "afterburner-http"
path = "src/bin/afterburner_http.rs"

[[bin]]
name = "afterburner-dashboard"
path = "src/bin/afterburner_dashboard.rs"

[dependencies]
afterburner-core = { path = "crates/afterburner-core" }
base64 = "0.22"
burn = { version = "0.20.1", features = [
  "fusion",
  "metal",
  "std",
  "train",
  "tui",
  "vision",
  "wgpu",
  "ndarray",
] }
ctrlc = "3.4"
png = "0.17"
ratatui = "0.29.0"
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[dependencies.burn-autodiff]
version = "0.20.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
