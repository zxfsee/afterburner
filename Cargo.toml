[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "afterburner-http"
path = "src/bin/afterburner_http.rs"

[dependencies]
base64 = "0.22"
burn = { version = "0.19.1", features = [
  "fusion",
  "std",
  "train",
  "tui",
  "vision",
  "wgpu",
  "ndarray",
] }
png = "0.17"
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[dependencies.burn-autodiff]
version = "0.19.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
