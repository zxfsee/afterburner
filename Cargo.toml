[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[package.metadata.git-cliff.changelog]
header = """# Changelog

## TODO

- OpenTelemetry semantic alignment gate [Experimentation/Eval Infra, Runtime Infra]
  - Goal: Align local eval/infer monitoring event names, units, and required fields with OpenTelemetry semantic conventions, without adding OTel SDK/exporter runtime dependencies yet.
  - Kind: `gate`
  - Boundary: `none`
  - Contracts: `event`
  - Scope: `fixtures/eval_pipeline_monitoring_event.json`, `tests/eval_cli.rs`, `tests/http_graceful_shutdown.rs`, `ARCHITECTURE.md`

- Cargo workspace boundary split + dependency gate [Frameworks, Runtime Infra]
  - Goal: Split into Cargo workspace boundaries (`core` and adapters) and add an enforceable dependency gate so codebase growth remains maintainable and CI can target crates.
  - Kind: `mixed`
  - Boundary: `core-contract`
  - Contracts: `none`
  - Scope: `Cargo.toml`, `crates/`, `tests/`, `justfile`, `ARCHITECTURE.md`

- Custom kernel adoption threshold contract [Kernels, Numerics]
  - Goal: Define measurable thresholds and compatibility gates for custom kernel introduction so optimization work is evidence-driven and reversible.
  - Kind: `mixed`
  - Boundary: `core-contract`
  - Contracts: `artifact`
  - Scope: `src/train.rs`, `src/model.rs`, `tests/kernel_logits_shape.rs`, `fixtures/kernel_adoption_thresholds.json`, `docs/adr/`

- Async/runtime decision record (Tokio ecosystem) [Runtime Infra, Frameworks]
  - Goal: Decide if async runtime adoption is required for adapters and document constraints/trade-offs before introducing Tokio-dependent code.
  - Kind: `behavior`
  - Boundary: `adapter-http`
  - Contracts: `none`
  - Scope: `docs/adr/`, `ARCHITECTURE.md`

## [Trunk]
"""
body = """
{% if commits | length > 0 -%}
{% for group, commits in commits | group_by(attribute="group") -%}

### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}])
{% endfor %}
{% endfor -%}
{% else -%}
- No notable changes.
{% endif -%}

{% if commits | length > 0 -%}

[Trunk]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/HEAD
{% for commit in commits -%}
[{{ commit.id | truncate(length=7, end="") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}
{% endfor -%}
{% endif -%}
"""
footer = """

<!-- generated by git-cliff -->"""
trim = false

[package.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = false
remote = "upstream"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chore" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = ".*", group = "Other" },
]
tag_pattern = "v*"

[package.metadata.git-cliff.remote]
offline = true

[package.metadata.git-cliff.remote.github]
owner = "zxfsee"
repo = "afterburner"

[package.metadata.afterburner.compiler_feature_matrix]
schema_version = "1"

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "cpu"
enabled_features = ["ndarray"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "wgpu"
enabled_features = ["wgpu"]

[[bin]]
name = "afterburner-http"
path = "src/bin/afterburner_http.rs"

[[bin]]
name = "afterburner-dashboard"
path = "src/bin/afterburner_dashboard.rs"

[dependencies]
base64 = "0.22"
burn = { version = "0.20.1", features = [
  "fusion",
  "std",
  "train",
  "tui",
  "vision",
  "wgpu",
  "ndarray",
] }
ctrlc = "3.4"
png = "0.17"
ratatui = "0.29.0"
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[dependencies.burn-autodiff]
version = "0.20.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
