[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [".", "crates/afterburner-core"]
resolver = "2"

[package.metadata.git-cliff.changelog]
header = """# Changelog

## TODO

- Scheduler heartbeat pointer adapter [Distributed Training, Runtime Infra, Serving/Deployment Infra]
  - Goal: Materialize one pointer artifact over the current scheduler heartbeat so downstream control-plane tooling can resolve the active heartbeat record without shell conventions or a persistent coordination store prematurely.
  - Kind: `mixed`
  - Boundary: `runtime-scheduler`
  - Contracts: `artifact`, `event`, `ops`
  - Scope: `src/`, `fixtures/`, `tests/`, `justfile`, `docs/reference.md`, `docs/adr/`

- Scheduler heartbeat pointer history adapter [Distributed Training, Runtime Infra, Serving/Deployment Infra]
  - Goal: Append one compact history artifact over scheduler heartbeat pointer changes so downstream control-plane tooling can audit active-heartbeat selection changes without shell logs or a persistent coordination store prematurely.
  - Kind: `mixed`
  - Boundary: `runtime-scheduler`
  - Contracts: `artifact`, `event`, `ops`
  - Scope: `src/`, `fixtures/`, `tests/`, `justfile`, `docs/reference.md`, `docs/adr/`
  - Blocked-by: Scheduler heartbeat pointer adapter

- Scheduler heartbeat pointer reconciliation adapter [Distributed Training, Runtime Infra, Serving/Deployment Infra]
  - Goal: Materialize one reconciliation artifact over the scheduler heartbeat pointer so downstream control-plane tooling can compare desired active-heartbeat selection against the current pointer artifact without shell checks or a persistent coordination store prematurely.
  - Kind: `mixed`
  - Boundary: `runtime-scheduler`
  - Contracts: `artifact`, `event`, `ops`
  - Scope: `src/`, `fixtures/`, `tests/`, `justfile`, `docs/reference.md`, `docs/adr/`
  - Blocked-by: Scheduler heartbeat pointer adapter

- Scheduler heartbeat pointer supersession adapter [Distributed Training, Runtime Infra, Serving/Deployment Infra]
  - Goal: Materialize one supersession artifact over scheduler heartbeat pointer state so downstream control-plane tooling can compare prior versus replacement active-heartbeat selection without shell logs or a persistent coordination store prematurely.
  - Kind: `mixed`
  - Boundary: `runtime-scheduler`
  - Contracts: `artifact`, `event`, `ops`
  - Scope: `src/`, `fixtures/`, `tests/`, `justfile`, `docs/reference.md`, `docs/adr/`
  - Blocked-by: Scheduler heartbeat pointer adapter

- Scheduler heartbeat pointer supersession history adapter [Distributed Training, Runtime Infra, Serving/Deployment Infra]
  - Goal: Append one compact history artifact over scheduler heartbeat pointer supersession changes so downstream control-plane tooling can audit prior-versus-replacement active-heartbeat selection transitions without shell logs or a persistent coordination store prematurely.
  - Kind: `mixed`
  - Boundary: `runtime-scheduler`
  - Contracts: `artifact`, `event`, `ops`
  - Scope: `src/`, `fixtures/`, `tests/`, `justfile`, `docs/reference.md`, `docs/adr/`
  - Blocked-by: Scheduler heartbeat pointer supersession adapter

- Scheduler heartbeat pointer supersession reconciliation adapter [Distributed Training, Runtime Infra, Serving/Deployment Infra]
  - Goal: Materialize one reconciliation artifact over scheduler heartbeat pointer supersession state so downstream control-plane tooling can compare desired-versus-current active-heartbeat replacement selection without shell checks or a persistent coordination store prematurely.
  - Kind: `mixed`
  - Boundary: `runtime-scheduler`
  - Contracts: `artifact`, `event`, `ops`
  - Scope: `src/`, `fixtures/`, `tests/`, `justfile`, `docs/reference.md`, `docs/adr/`
  - Blocked-by: Scheduler heartbeat pointer supersession adapter

## [Trunk]
"""
body = """
{% if commits | length > 0 -%}
{% for group, commits in commits | group_by(attribute="group") -%}

### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}])
{% endfor %}
{% endfor -%}
{% else -%}
- No notable changes.
{% endif -%}

{% if commits | length > 0 -%}

[Trunk]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/HEAD
{% for commit in commits -%}
[{{ commit.id | truncate(length=7, end="") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}
{% endfor -%}
{% endif -%}
"""
footer = """

<!-- generated by git-cliff -->"""
trim = false

[package.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = false
remote = "upstream"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chore" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = ".*", group = "Other" },
]
tag_pattern = "v*"

[package.metadata.git-cliff.remote]
offline = true

[package.metadata.git-cliff.remote.github]
owner = "zxfsee"
repo = "afterburner"

[package.metadata.afterburner.compiler_feature_matrix]
schema_version = "1"

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "cpu"
enabled_features = ["ndarray"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "wgpu"
enabled_features = ["wgpu"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "metal"
enabled_features = ["wgpu", "metal"]

[[bin]]
name = "afterburner-http"
path = "src/bin/afterburner_http.rs"

[[bin]]
name = "afterburner-dashboard"
path = "src/bin/afterburner_dashboard.rs"

[dependencies]
afterburner-core = { path = "crates/afterburner-core" }
base64 = "0.22"
burn = { version = "0.20.1", features = [
  "fusion",
  "metal",
  "std",
  "train",
  "tui",
  "vision",
  "wgpu",
  "ndarray",
] }
ctrlc = "3.4"
png = "0.17"
ratatui = "0.29.0"
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[dependencies.burn-autodiff]
version = "0.20.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
