[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[package.metadata.git-cliff.changelog]
header = """# Changelog

## TODO

- Infer done event fixture gate [Inference, Runtime Infra]
  - Goal: Pin `infer_done` event field contract (`backend`, `artifact`, `artifact_version`, `elapsed_ms`) with fixture-backed assertions to prevent observability drift.
  - Kind: `gate`
  - Boundary: `adapter-cli`
  - Contracts: `event`
  - Scope: `tests/infer_cli.rs`, `fixtures/infer_done_event.json`

- Eval summary JSON fixture gate [Experimentation/Eval Infra, Data Infra]
  - Goal: Pin eval summary JSON top-level field contract (including `artifact_version`) with fixture-backed assertions for downstream parser stability.
  - Kind: `gate`
  - Boundary: `adapter-cli`
  - Contracts: `artifact`
  - Scope: `tests/eval_cli.rs`, `fixtures/eval_summary_success.json`

- HTTP infer single-response envelope consistency [Serving/Deployment Infra, Inference]
  - Goal: Align HTTP `/infer` single-item success envelope shape with the batch contract and add fixture-backed assertions (`batch_size`, logits row width) to prevent adapter drift.
  - Kind: `mixed`
  - Boundary: `adapter-http`
  - Contracts: `HTTP`
  - Scope: `tests/http_graceful_shutdown.rs`, `fixtures/http_infer_single_success_envelope.json`

- Backend performance profile gate [Kernels, Runtime Infra]
  - Goal: Add benchmark/acceptance gates that identify when `wgpu` is not the best runtime choice and define objective criteria for introducing a native backend.
  - Kind: `gate`
  - Boundary: `adapter-cli`
  - Contracts: `ops`
  - Scope: `justfile`, `tests/perf_backend_profile.rs`, `artifacts/eval/`, `README.md`

- Burn TUI observability dashboard adapter [Experimentation/Eval Infra, Runtime Infra]
  - Goal: Add a lightweight dashboard adapter over existing structured events (without coupling core to UI runtime) for operator-facing eval/training monitoring.
  - Kind: `mixed`
  - Boundary: `adapter-cli`
  - Contracts: `event`
  - Scope: `src/bin/`, `tests/`, `README.md`

- OpenTelemetry semantic alignment gate [Experimentation/Eval Infra, Runtime Infra]
  - Goal: Align local eval/infer monitoring event names, units, and required fields with OpenTelemetry semantic conventions, without adding OTel SDK/exporter runtime dependencies yet.
  - Kind: `gate`
  - Boundary: `none`
  - Contracts: `event`
  - Scope: `fixtures/eval_pipeline_monitoring_event.json`, `tests/eval_cli.rs`, `tests/http_graceful_shutdown.rs`, `ARCHITECTURE.md`

## [Trunk]
"""
body = """
{% if commits | length > 0 -%}
{% for group, commits in commits | group_by(attribute="group") -%}

### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}])
{% endfor %}
{% endfor -%}
{% else -%}
- No notable changes.
{% endif -%}

{% if commits | length > 0 -%}

[Trunk]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/HEAD
{% for commit in commits -%}
[{{ commit.id | truncate(length=7, end="") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}
{% endfor -%}
{% endif -%}
"""
footer = """

<!-- generated by git-cliff -->"""
trim = false

[package.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = false
remote = "upstream"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chore" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = ".*", group = "Other" },
]
tag_pattern = "v*"

[package.metadata.git-cliff.remote]
offline = true

[package.metadata.git-cliff.remote.github]
owner = "zxfsee"
repo = "afterburner"

[package.metadata.afterburner.compiler_feature_matrix]
schema_version = "1"

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "cpu"
enabled_features = ["ndarray"]

[[package.metadata.afterburner.compiler_feature_matrix.backend_feature_matrix]]
backend = "wgpu"
enabled_features = ["wgpu"]

[[bin]]
name = "afterburner-http"
path = "src/bin/afterburner_http.rs"

[dependencies]
base64 = "0.22"
burn = { version = "0.20.1", features = [
  "fusion",
  "std",
  "train",
  "tui",
  "vision",
  "wgpu",
  "ndarray",
] }
ctrlc = "3.4"
png = "0.17"
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"

[dependencies.burn-autodiff]
version = "0.20.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
